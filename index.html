<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tarefas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Minhas Tarefas</title>
<style>
:root{--bg:#f6f6f8;--card:#fff;--text:#18181b;--muted:#8b8b95;--line:#ececf0;--accent:#5b5bd6;--accent-soft:#ececfd;--high:#e5484d;--mid:#f5a524;--low:#a3a3ae;--shadow:0 1px 2px rgba(20,20,40,.05),0 4px 14px rgba(20,20,40,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f12;--card:#1a1a1f;--text:#f4f4f6;--muted:#8e8e98;--line:#2a2a31;--accent:#8b8bf0;--accent-soft:#25254a;--low:#6b6b76;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
header,.tabs,#content,.prog{max-width:640px;margin-left:auto;margin-right:auto}
header{padding:calc(18px + env(safe-area-inset-top)) 20px 4px;display:flex;align-items:flex-start;gap:8px}
.hd{flex:1;min-width:0}
h1{margin:0;font-size:30px;letter-spacing:-.5px;line-height:1.15;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.prog{height:6px;border-radius:99px;background:var(--line);margin-top:12px;overflow:hidden;width:calc(100% - 40px)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .35s}
#q{display:none;width:calc(100% - 40px);max-width:600px;margin:10px auto 0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:11px 14px;font:inherit}
#q.on{display:block}
.tabs{display:flex;gap:8px;padding:14px 20px 6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:var(--card);box-shadow:var(--shadow);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab b{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:0 7px}
.tab.on{background:var(--accent);color:#fff}
.tab.on b{background:rgba(255,255,255,.25);color:#fff}
.tab.add{background:none;box-shadow:none;border:1px dashed var(--line);color:var(--muted)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 20px 8px;display:flex;gap:8px;font-weight:600}
h2 span{font-weight:400}
h2.late{color:var(--high)}
ul{list-style:none;margin:0;padding:0 16px}
.task{position:relative;overflow:hidden;background:var(--card);border-radius:16px;margin-bottom:8px;box-shadow:var(--shadow);touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.rowin{display:flex;gap:12px;align-items:flex-start;background:var(--card);padding:13px 14px;position:relative;z-index:1;transition:transform .2s,background .15s}
.task.drag .rowin{transition:none}
.swdel{display:none;position:absolute;right:0;top:0;bottom:0;width:96px;border:0;background:var(--high);color:#fff;font-weight:600;align-items:center;justify-content:center;cursor:pointer}
.task.sw .swdel,.task.drag .swdel{display:flex}
.task.sel .rowin{background:var(--accent-soft)}
.task.sel .chk{background:var(--accent);border-color:var(--accent)}
.task.sel .chk::after{content:"✓";color:#fff;font-size:14px;line-height:1}
.selbar{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:15}
.selbar .row button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:600;cursor:pointer;background:var(--card);box-shadow:var(--shadow)}
.selbar .row .dng{background:var(--high);color:#fff;flex:1.4}
.chk{position:relative;flex:none;width:24px;height:24px;margin-top:1px;border-radius:50%;border:2px solid var(--low);background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.chk::before{content:"";position:absolute;inset:-10px}
.chk.p-alta{border-color:var(--high)}.chk.p-media{border-color:var(--mid)}.chk.p-baixa{border-color:var(--low)}
.task.done .chk,.chk.on{background:var(--accent);border-color:var(--accent)}
.task.done .chk::after,.chk.on::after{content:"✓";color:#fff;font-size:14px;line-height:1}
.task.just .chk{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.3)}}
.body{flex:1;min-width:0;cursor:pointer}
.t{overflow-wrap:anywhere}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task.done{opacity:.65}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:3px}
.meta .late{color:var(--high);font-weight:600}
.lst{display:inline-flex;align-items:center;gap:5px}
.lst i{width:8px;height:8px;border-radius:50%;display:inline-block}
.more{display:flex;align-items:center;gap:8px;width:calc(100% - 32px);margin:14px 16px 0;border:0;background:none;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:8px 4px;cursor:pointer;text-align:left}
.more b{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:0 7px;letter-spacing:0}
.more i{font-style:normal;margin-left:auto}
.donebtn{display:block;margin:14px auto 0;border:0;background:none;color:var(--muted);font-size:14px;padding:8px 14px;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:56px 24px}
.empty big{display:block;font-size:40px;margin-bottom:8px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:24px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%)}
.bar-in{max-width:640px;margin:auto}
.prev{display:none;gap:6px;flex-wrap:wrap;margin:0 4px 8px}
.prev.on{display:flex}
.prev span{font-size:12.5px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:3px 10px}
.row{display:flex;gap:8px}
#newTask{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:13px 15px;font:inherit;box-shadow:var(--shadow)}
.go{border:0;background:var(--accent);color:#fff;border-radius:14px;width:50px;font-size:26px;cursor:pointer;flex:none}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#27272a;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:92vw}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:#a5b4fc;font-weight:600;cursor:pointer;padding:0}
dialog{border:0;padding:0;background:var(--card);color:var(--text);width:100%;max-width:560px;margin:auto auto 0;border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;animation:up .22s ease-out}
dialog::backdrop{background:rgba(0,0,0,.45);backdrop-filter:blur(2px)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh{padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
.sh label{display:block;font-size:12.5px;color:var(--muted);margin:16px 0 6px}
.sh input:not([type=checkbox]),.sh select,.sh textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:11px 12px;font:inherit}
.sh textarea{resize:vertical;min-height:64px}
#eTitle{font-size:18px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button,.seg button{border:0;background:var(--bg);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.seg{display:flex;gap:6px}
.seg button{flex:1;border-radius:10px;padding:9px}
.seg button.on{background:var(--accent);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subs{padding:0;margin:0}
.subs li{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.subs .chk{width:20px;height:20px}
.subs .chk.on::after{font-size:12px}
.subs .sinp{border:0!important;background:transparent!important;padding:6px 4px!important}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.acts{display:flex;gap:8px;margin-top:22px}
.acts button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:600;cursor:pointer;background:var(--bg)}
.acts .pri{background:var(--accent);color:#fff;flex:2}
.acts .dng{color:var(--high)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:14px 4px;font-size:16px;cursor:pointer;border-bottom:1px solid var(--line)}
.menu button.dng{color:var(--high)}
.menu small{display:block;color:var(--muted);margin-top:14px}
#aMsg{display:block;min-height:1.2em;margin-top:8px;font-size:13px;color:var(--high)}
.cal{margin:8px 16px 4px;background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calhd .ib{width:34px;height:34px;box-shadow:none;background:var(--bg);font-size:20px;line-height:1}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.dow span{font-size:12px;color:var(--muted);padding:4px 0}
.day{border:0;background:none;height:44px;border-radius:12px;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text)}
.day.today{color:var(--accent);font-weight:700}
.day.sel{background:var(--accent);color:#fff}
.dots{display:flex;gap:3px;height:5px}
.dots b{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day.sel .dots b{background:#fff}
</style>
</head>
<body>
<header>
  <div class="hd"><h1 id="title"></h1><div class="sub" id="sub"></div></div>
  <button class="ib" id="btnSearch" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  <button class="ib" id="btnMenu" aria-label="Mais opções"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
</header>
<input id="q" type="search" placeholder="Buscar tarefas…" autocomplete="off">
<div class="prog" id="prog" hidden><i id="progBar"></i></div>
<nav class="tabs" id="tabs"></nav>
<main id="content"></main>

<div id="toast"><span id="toastMsg"></span><button id="toastUndo">Desfazer</button></div>

<div class="selbar" id="selbar" hidden>
  <div class="bar-in row"><button type="button" id="selCancel">Cancelar</button><button type="button" id="selAll">Todas</button><button type="button" class="dng" id="selDel">Excluir</button></div>
</div>

<form class="bar" id="form" autocomplete="off">
  <div class="bar-in">
    <div class="prev" id="prev"></div>
    <div class="row">
      <input id="newTask" placeholder="Nova tarefa… ex.: ler amanhã !alta" aria-label="Nova tarefa" enterkeyhint="done">
      <button class="go" aria-label="Adicionar">+</button>
    </div>
  </div>
</form>

<dialog id="sheet">
  <form method="dialog" id="eform" class="sh">
    <input id="eTitle" aria-label="Título" placeholder="Título">
    <label for="eNotes">Notas</label>
    <textarea id="eNotes" placeholder="Detalhes, links, o que precisar lembrar…"></textarea>
    <label for="eDate">Data</label>
    <input id="eDate" type="date">
    <div class="chips" id="dateChips">
      <button type="button" data-d="hoje">Hoje</button><button type="button" data-d="amanha">Amanhã</button><button type="button" data-d="semana">Próx. semana</button><button type="button" data-d="none">Sem data</button>
    </div>
    <div class="two">
      <div><label for="eTime">Horário</label><input id="eTime" type="time"></div>
      <div><label for="eRemind">Lembrete</label>
        <select id="eRemind"><option value="">Sem lembrete</option><option value="0">Na hora</option><option value="10">10 min antes</option><option value="60">1 hora antes</option><option value="1440">1 dia antes</option></select></div>
    </div>
    <label>Prioridade</label>
    <div class="seg" id="prioSeg"><button type="button" data-p="baixa">Baixa</button><button type="button" data-p="media">Média</button><button type="button" data-p="alta">Alta</button></div>
    <div class="two">
      <div><label for="eRepeat">Repetir</label>
        <select id="eRepeat"><option value="">Não repete</option><option value="daily">Todo dia</option><option value="weekly">Toda semana</option><option value="monthly">Todo mês</option></select></div>
      <div><label for="eList">Lista</label><select id="eList"></select></div>
    </div>
    <label>Subtarefas</label>
    <ul class="subs" id="subs"></ul>
    <input id="newSub" placeholder="+ Adicionar subtarefa" enterkeyhint="done">
    <div class="acts">
      <button type="button" class="dng" id="eDel">Excluir</button>
      <button type="button" id="eCancel">Cancelar</button>
      <button class="pri" value="ok">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="nameDlg">
  <form method="dialog" id="nameForm" class="sh">
    <strong id="nameTitle">Nova lista</strong>
    <label for="nName">Nome</label>
    <input id="nName" maxlength="30" required>
    <div class="acts"><button type="button" id="nCancel">Cancelar</button><button class="pri" value="ok">Salvar</button></div>
  </form>
</dialog>

<dialog id="alexaDlg">
  <div class="sh">
    <strong>Conectar Alexa</strong>
    <label for="aCode">Código de conexão</label>
    <textarea id="aCode" rows="3" placeholder="Cole aqui o código de conexão" autocomplete="off" spellcheck="false"></textarea>
    <small id="aMsg"></small>
    <div class="acts"><button type="button" id="aCancel">Cancelar</button><button type="button" class="pri" id="aGo">Conectar</button></div>
  </div>
</dialog>

<dialog id="menuDlg">
  <div class="sh menu">
    <strong>Mais opções</strong>
    <button id="mRename" hidden>Renomear esta lista</button>
    <button id="mDelList" class="dng" hidden>Excluir esta lista</button>
    <button id="mAlexa">Conectar Alexa</button>
    <button id="mNotify">Ativar notificações</button>
    <small style="margin:-6px 0 6px">Os lembretes aparecem enquanto o app está aberto (ou quando você abrir). Para avisar com o app fechado seria preciso um servidor de notificações.</small>
    <button id="mExport">Exportar backup</button>
    <button id="mImport">Importar backup</button>
    <button id="mClear" class="dng">Apagar tarefas concluídas</button>
    <small>Seus dados ficam salvos só neste aparelho. Exporte um backup de vez em quando.</small>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
</dialog>

<script>
/* ---------- utilidades ---------- */
const KEY='tarefas.v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const diffDays=s=>Math.round((parseD(s)-parseD(today()))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MAP={'á':'a','à':'a','â':'a','ã':'a','ä':'a','é':'e','ê':'e','è':'e','í':'i','î':'i','ó':'o','ô':'o','õ':'o','ò':'o','ú':'u','û':'u','ü':'u','ç':'c'};
const norm=s=>s.toLowerCase().replace(/[áàâãäéêèíîóôõòúûüç]/g,c=>MAP[c]);
const PW={alta:0,media:1,baixa:2};
const PALETTE=['#6366f1','#10b981','#f59e0b','#ef4444','#06b6d4','#d946ef','#84cc16','#f97316'];
const DOW=['domingo','segunda','terca','quarta','quinta','sexta','sabado'];
const REP={daily:'Todo dia',weekly:'Toda semana',monthly:'Todo mês'};
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};

function label(s){
  const n=diffDays(s);
  if(n===0)return 'Hoje'; if(n===1)return 'Amanhã'; if(n===-1)return 'Ontem';
  if(n>1&&n<7)return parseD(s).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
  const [,m,d]=s.split('-'); return d+'/'+m;
}
function listColor(name){let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}

/* ---------- estado ---------- */
const isYmd=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&ymd(parseD(s))===s;
function normalize(s){
  if(!s||!Array.isArray(s.tasks))s={lists:[],tasks:[]};
  let lists=Array.isArray(s.lists)?s.lists.map(l=>String(l).trim().slice(0,30)).filter(Boolean):[];
  lists=[...new Set(lists)];
  if(!(s.settings&&s.settings.v2))lists=lists.filter(l=>l!=='Geral'); // "Geral" deixou de existir: tarefas sem lista
  const seen=new Set();
  const tasks=s.tasks.filter(t=>t&&typeof t==='object').map(t=>{
    let id=/^[\w-]{1,40}$/.test(String(t.id||''))?String(t.id):uid();
    while(seen.has(id))id=uid();seen.add(id);
    const rm=String(t.remind==null?'':t.remind);
    return {id,title:String(t.title||''),done:!!t.done,prio:PW[t.prio]!==undefined?t.prio:'media',
      date:isYmd(t.date)?t.date:'',list:lists.includes(t.list)?t.list:'',notes:String(t.notes||''),
      subs:Array.isArray(t.subs)?t.subs.filter(x=>x&&typeof x==='object').map(x=>({t:String(x.t||''),done:!!x.done})):[],
      repeat:REP[t.repeat]?t.repeat:'',anchor:Math.min(31,Math.max(0,Math.floor(+t.anchor)||0)),
      doneAt:isYmd(t.doneAt)?t.doneAt:'',created:+t.created||0,
      time:/^\d{2}:\d{2}$/.test(t.time||'')?t.time:'',remind:['','0','10','60','1440'].includes(rm)?rm:'',
      notified:String(t.notified||''),src:String(t.src||'').slice(0,80)};
  });
  return {lists,tasks,settings:{notify:!!(s.settings&&s.settings.notify),v2:true}};
}
let state;
try{
  const raw=localStorage.getItem(KEY);
  try{state=normalize(JSON.parse(raw))}
  catch(e){ // dados ilegíveis: guarda uma cópia antes que o próximo salvamento sobrescreva
    if(raw)try{localStorage.setItem(KEY+'.corrompido',raw)}catch(_){}
    state=normalize(null);
  }
}catch(e){state=normalize(null)}
let saveWarned=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){
  if(!saveWarned){saveWarned=true;setTimeout(()=>toast('Não consegui salvar neste aparelho. Exporte um backup.'),0)}}};
window.addEventListener('storage',e=>{ // outra janela/aba do app mexeu nos dados
  if(e.key!==KEY||!e.newValue)return;
  try{state=normalize(JSON.parse(e.newValue));render()}catch(_){}
});
let view='hoje',showDone=false,searchOn=false,justId=null,draft=null,editId=null,nameMode='new';
let showSoon=false,showNoDate=false;
let selMode=false,selIds=new Set(),openLi=null,gest=null,suppress=0,lpPending=false; // seleção em massa e deslizar para excluir
const resetSel=()=>{selMode=false;selIds=new Set()};
let calSel=today(),calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
const get=id=>state.tasks.find(t=>t.id===id);

/* ---------- entrada rápida em português ---------- */
function parseQuick(raw){
  let n=norm(raw);const cut=[];const out={};
  const take=(re,fn)=>{const m=re.exec(n);if(!m)return;if(fn(m)===false)return;cut.push([m.index,m.index+m[0].length]);
    n=n.slice(0,m.index)+'\u0001'.repeat(m[0].length)+n.slice(m.index+m[0].length)};
  take(/\bdepois de amanha\b/,()=>out.date=ymd(addDays(new Date(),2)));
  take(/\bamanha\b/,()=>out.date=ymd(addDays(new Date(),1)));
  take(/\bhoje\b/,()=>out.date=ymd(new Date()));
  take(/\b(semana que vem|proxima semana)\b/,()=>out.date=ymd(addDays(new Date(),7)));
  take(/\bdia ([1-9]|[12]\d|3[01])\b/,m=>{
    const d=+m[1],now=new Date();let mo=now.getMonth();
    if(d<now.getDate())mo++;
    const dt=new Date(now.getFullYear(),mo,d);
    if(dt.getDate()!==d)return false;
    out.date=ymd(dt);
  });
  take(/\b(todo dia|todos os dias|diariamente)\b/,()=>out.repeat='daily');
  take(/\b(toda semana|semanalmente)\b/,()=>out.repeat='weekly');
  take(/\b(todo mes|mensalmente)\b/,()=>out.repeat='monthly');
  take(/\b(?:(toda|todo|todas|todos|na|no|proxima|proximo|nesta|neste|esta|este)\s+)?(segunda|terca|quarta|quinta|sexta|sabado|domingo)(?:-feira)?\b/,m=>{
    const idx=DOW.indexOf(m[2]);let diff=(idx-new Date().getDay()+7)%7;
    if(m[1]&&/^prox/.test(m[1])&&diff===0)diff=7;
    out.date=ymd(addDays(new Date(),diff));
    if(m[1]&&/^tod/.test(m[1])&&!out.repeat)out.repeat='weekly';
  });
  // horário: "às 15h", "as 15h30", "15:30", "15h30"; "15h" sozinho só vale a partir das 7h (evita "estudar 3h")
  take(/\b(as\s+)?([01]?\d|2[0-3])\s?(?:h|horas?)([0-5]\d)?\b/,m=>{
    if(!m[1]&&!m[3]&&+m[2]<7)return false;
    out.time=pad(+m[2])+':'+pad(m[3]?+m[3]:0);
  });
  take(/\b(as\s+)?([01]?\d|2[0-3]):([0-5]\d)\b/,m=>{out.time=pad(+m[2])+':'+m[3]});
  take(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{4}|\d{2}))?\b/,m=>{
    const d=+m[1],mo=+m[2];
    if(mo<1||mo>12||d<1||d>31)return false;
    const now=new Date();let y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):now.getFullYear();
    let dt=new Date(y,mo-1,d);
    if(dt.getDate()!==d)return false; // dia que não existe no mês (31/02)
    if(!m[3]&&ymd(dt)<today()){dt=new Date(y+1,mo-1,d);if(dt.getDate()!==d)return false}
    out.date=ymd(dt);
  });
  take(/(^|\s)!(alta|media|baixa|1|2|3)\b/,m=>{out.prio={alta:'alta',1:'alta',media:'media',2:'media',baixa:'baixa',3:'baixa'}[m[2]]});
  take(/\bprioridade (alta|media|baixa)\b/,m=>{out.prio=m[1]});
  take(/\b(muito )?urgente\b/,()=>{out.prio='alta'});
  for(const l of [...state.lists].sort((a,b)=>b.length-a.length)){ // nomes maiores primeiro: "Casa nova" antes de "Casa"
    const re=new RegExp('\\b(?:na|no|em|para a|para o|pra|a) (?:minha )?lista (?:de |da |do )?'+norm(l).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b');
    const lm2=re.exec(n);
    if(lm2){out.list=l;cut.push([lm2.index,lm2.index+lm2[0].length]);n=n.slice(0,lm2.index)+'\u0001'.repeat(lm2[0].length)+n.slice(lm2.index+lm2[0].length);break}
  }
  const lm=/(^|\s)#([a-z0-9_-]+)/.exec(n);
  if(lm){const found=state.lists.find(l=>norm(l).replace(/\s+/g,'-')===lm[2]);
    if(found){out.list=found;cut.push([lm.index,lm.index+lm[0].length])}}
  let t='';
  for(let i=0;i<raw.length;i++)if(!cut.some(([a,b])=>i>=a&&i<b))t+=raw[i];
  t=t.replace(/\s+/g,' ').trim().replace(/^[,;:-]\s*|\s*[,;:-]$/g,'');
  out.title=t||raw.trim();
  return out;
}

/* ---------- repetição ---------- */
function nextDate(t){
  const td=today();let d=parseD(t.date||td);
  const step=()=>{
    if(t.repeat==='daily')d=addDays(d,1);
    else if(t.repeat==='weekly')d=addDays(d,7);
    else{const day=t.anchor||d.getDate();d=new Date(d.getFullYear(),d.getMonth()+1,1);
      d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));}
  };
  step();while(ymd(d)<=td)step();
  return ymd(d);
}

/* ---------- toast ---------- */
let toastTimer,toastFn=null;
function toast(msg,undo){
  $('toastMsg').textContent=msg;toastFn=undo||null;
  $('toastUndo').style.display=undo?'':'none';
  $('toast').classList.add('on');clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$('toast').classList.remove('on'),5000);
}
$('toastUndo').onclick=()=>{if(toastFn)toastFn();toastFn=null;$('toast').classList.remove('on')};

/* ---------- ações ---------- */
function toggle(id){
  const t=get(id);if(!t)return;
  const snap=JSON.stringify(t);
  const restore=()=>{const i=state.tasks.findIndex(x=>x.id===id);if(i>-1)state.tasks[i]=JSON.parse(snap);save();render()};
  if(!t.done&&t.repeat){
    if(t.repeat==='monthly'&&!t.anchor)t.anchor=parseD(t.date||today()).getDate(); // lembra o dia 31 mesmo passando por fevereiro
    t.date=nextDate(t);t.notified='';t.subs.forEach(s=>s.done=false);buzz();
    toast('Concluída · repete '+label(t.date).toLowerCase(),restore);
  }else if(!t.done){
    t.done=true;t.doneAt=today();justId=id;buzz();toast('Tarefa concluída',restore);
  }else{t.done=false;t.doneAt=''}
  save();render();setTimeout(()=>justId=null,500);
}
function removeTask(id){
  const i=state.tasks.findIndex(t=>t.id===id);if(i<0)return;
  const [t]=state.tasks.splice(i,1);save();render();
  toast('Tarefa excluída',()=>{state.tasks.splice(Math.min(i,state.tasks.length),0,t);save();render()});
}

/* ---------- renderização ---------- */
const byPrio=(a,b)=>PW[a.prio]-PW[b.prio]||a.created-b.created;
const byTime=(a,b)=>(a.time||'99').localeCompare(b.time||'99')||byPrio(a,b);
const byDate=(a,b)=>(a.date||'9').localeCompare(b.date||'9')||byTime(a,b);

function rowHTML(t){
  const late=t.date&&!t.done&&diffDays(t.date)<0;
  const sd=t.subs.filter(s=>s.done).length;
  return `<li class="task ${t.done?'done':''} ${justId===t.id?'just':''} ${selIds.has(t.id)?'sel':''}" data-id="${t.id}"><div class="rowin">
    <button class="chk p-${t.prio}" data-a="toggle" aria-label="Concluir"></button>
    <div class="body" data-a="open"><div class="t">${esc(t.title)}</div>
    <div class="meta">${t.list?`<span class="lst"><i style="background:${listColor(t.list)}"></i>${esc(t.list)}</span>`:''}
    ${t.date?`<span class="${late?'late':''}">${label(t.date)}${t.time?' · '+t.time:''}</span>`:''}
    ${t.time&&t.remind!==''?'<span title="Lembrete">🔔</span>':''}
    ${t.repeat?'<span title="Repete">↻</span>':''}
    ${t.subs.length?`<span>☑ ${sd}/${t.subs.length}</span>`:''}
    ${t.notes?'<span title="Notas">✎</span>':''}</div></div></div><button class="swdel" data-a="swdel" aria-label="Excluir tarefa">Excluir</button></li>`;
}
const section=(title,ts,cls='')=>ts.length?`<h2 class="${cls}">${title}<span>${ts.length}</span></h2><ul>${ts.map(rowHTML).join('')}</ul>`:'';

function calHTML(td){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const startDow=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  const openBy={};state.tasks.forEach(t=>{if(t.date&&!t.done)openBy[t.date]=(openBy[t.date]||0)+1});
  let cells='';
  for(let i=0;i<startDow;i++)cells+='<span></span>';
  for(let d=1;d<=dim;d++){
    const s=y+'-'+pad(m+1)+'-'+pad(d),c=Math.min(openBy[s]||0,3);
    cells+=`<button class="day ${s===td?'today':''} ${s===calSel?'sel':''}" data-day="${s}">${d}<i class="dots">${'<b></b>'.repeat(c)}</i></button>`;
  }
  return `<div class="cal"><div class="calhd"><button class="ib" data-cal="-1" aria-label="Mês anterior">‹</button><strong>${(m=>m.charAt(0).toUpperCase()+m.slice(1))(calMonth.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))}</strong><button class="ib" data-cal="1" aria-label="Próximo mês">›</button></div><div class="dow">${['D','S','T','Q','Q','S','S'].map(x=>`<span>${x}</span>`).join('')}</div><div class="grid">${cells}</div></div>`;
}
function render(){
  const td=today(),all=state.tasks;
  openLi=null;
  if(selMode){selIds=new Set([...selIds].filter(id=>get(id)));if(!selIds.size)selMode=false}
  if(view.startsWith('l:')&&!state.lists.includes(view.slice(2)))view='hoje';
  const q=norm(($('q').value||'').trim());
  const searching=searchOn&&q;
  let open,done,title,sub,html='';
  const isList=view.startsWith('l:');

  if(searching){
    const m=all.filter(t=>norm(t.title+' '+t.notes).includes(q));
    open=m.filter(t=>!t.done).sort(byDate);done=m.filter(t=>t.done);
    title='Busca';sub=m.length+(m.length===1?' resultado':' resultados');
  }else if(view==='hoje'){
    open=all.filter(t=>!t.done&&t.date&&t.date<=td);done=all.filter(t=>t.done&&t.doneAt===td);
    title='Hoje';
    const s=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
    sub=s.charAt(0).toUpperCase()+s.slice(1);
  }else if(view==='cal'){
    const dayT=all.filter(t=>t.date===calSel);
    open=dayT.filter(t=>!t.done);done=dayT.filter(t=>t.done);
    title='Calendário';
    const s=parseD(calSel).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
    sub=s.charAt(0).toUpperCase()+s.slice(1);
  }else{
    const l=view.slice(2);
    open=all.filter(t=>!t.done&&t.list===l);done=all.filter(t=>t.done&&t.list===l);
    title=l;sub=open.length+(open.length===1?' pendente':' pendentes');
  }
  if(selMode){title=selIds.size+(selIds.size===1?' selecionada':' selecionadas');sub='Toque nas tarefas para marcar ou desmarcar'}
  $('title').textContent=title;$('sub').textContent=sub;

  const prog=$('prog');
  if(view==='hoje'&&!searching&&!selMode){
    const tot=open.length+done.length;prog.hidden=tot===0;
    $('progBar').style.width=(tot?Math.round(done.length/tot*100):0)+'%';
    $('sub').textContent=sub+(tot?` · ${done.length} de ${tot} feitas`:'');
  }else prog.hidden=true;

  if(searching){
    html+=section('Resultados',open);
  }else if(view==='hoje'){
    html+=section('Atrasadas',open.filter(t=>t.date<td).sort(byDate),'late');
    html+=section('Hoje',open.filter(t=>t.date===td).sort(byTime));
    const nodate=all.filter(t=>!t.done&&!t.date).sort(byPrio),soon=all.filter(t=>!t.done&&t.date>td).sort(byDate);
    const more=(k,l,n,on)=>n?`<button class="more" data-a="more" data-k="${k}">${l}<b>${n}</b><i>${on?'▾':'▸'}</i></button>`:'';
    html+=more('nodate','Sem data',nodate.length,showNoDate)+(showNoDate&&nodate.length?`<ul>${nodate.map(rowHTML).join('')}</ul>`:'');
    html+=more('soon','Em breve',soon.length,showSoon);
    if(showSoon)for(const d of [...new Set(soon.map(t=>t.date))]){
      const dt=parseD(d).toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});
      html+=section((diffDays(d)===1?'Amanhã · ':'')+dt.replace(/\./g,''),soon.filter(t=>t.date===d).sort(byTime));
    }
  }else if(view==='cal'){
    html+=calHTML(td)+section('Tarefas do dia',open.sort(byTime));
  }else{
    html+=section('Atrasadas',open.filter(t=>t.date&&t.date<td).sort(byDate),'late');
    html+=section('Hoje',open.filter(t=>t.date===td).sort(byTime));
    html+=section('Em breve',open.filter(t=>t.date>td).sort(byDate));
    html+=section('Sem data',open.filter(t=>!t.date).sort(byPrio));
  }
  if(done.length){
    html+=`<button class="donebtn" data-a="showdone">${showDone?'Ocultar':'Mostrar'} concluídas (${done.length})</button>`;
    if(showDone)html+=`<ul style="margin-top:8px">${done.sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||'')).map(rowHTML).join('')}</ul>`;
  }
  if(!open.length&&!(showDone&&done.length)){
    const msg=searching?['🔍','Nada encontrado.']:view==='hoje'?(done.length?['🎉','Tudo feito por hoje!']:['✨','Dia livre. Nada para hoje.']):view==='cal'?['🗓️','Nada neste dia.']:['✨','Nada por aqui. Adicione sua primeira tarefa.'];
    const em=`<div class="empty"><big>${msg[0]}</big>${msg[1]}</div>`;
    html=(view==='cal'&&!searching)?html+em:em+html;
  }
  $('content').innerHTML=html;

  const nToday=all.filter(t=>!t.done&&t.date&&t.date<=td).length;
  const chips=[['hoje','Hoje',nToday],['cal','Calendário',0],...state.lists.map(l=>['l:'+l,l,0])];
  $('tabs').innerHTML=chips.map(([v,l,n])=>`<button class="tab ${v===view?'on':''}" data-v="${esc(v)}">${esc(l)}${n?`<b>${n}</b>`:''}</button>`).join('')+'<button class="tab add" data-add="1">+ Lista</button>';
  $('form').hidden=selMode;$('selbar').hidden=!selMode;
}

/* ---------- eventos principais ---------- */
$('content').onclick=e=>{
  if(lpPending){lpPending=false;return} // o clique de quando você solta depois de segurar
  if(Date.now()<suppress)return; // o toque que termina um gesto não vira clique
  if(openLi&&!e.target.closest('[data-a="swdel"]')){closeSwipe();return}
  if(selMode){const l=e.target.closest('li.task');if(l){toggleSel(l.dataset.id);return}}
  const dy=e.target.closest('[data-day]');if(dy){resetSel();calSel=dy.dataset.day;render();return}
  const nv=e.target.closest('[data-cal]');
  if(nv){resetSel();calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+(+nv.dataset.cal),1);render();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.a==='showdone'){resetSel();showDone=!showDone;render();return}
  if(b.dataset.a==='more'){resetSel();if(b.dataset.k==='soon')showSoon=!showSoon;else showNoDate=!showNoDate;render();return}
  const li=b.closest('li');if(!li)return;
  if(b.dataset.a==='swdel'){openLi=null;removeTask(li.dataset.id);return}
  if(b.dataset.a==='toggle')toggle(li.dataset.id);else openSheet(li.dataset.id);
};

/* ---------- gestos: deslizar para excluir, segurar para selecionar ---------- */
const rowIn=li=>li.querySelector('.rowin');
function closeSwipe(){if(openLi){openLi.classList.remove('sw');rowIn(openLi).style.transform='';openLi=null}}
function enterSel(id){closeSwipe();selMode=true;selIds=new Set([id]);buzz();render()}
function toggleSel(id){selIds.has(id)?selIds.delete(id):selIds.add(id);render()}
function removeMany(ids){
  const items=[];state.tasks.forEach((t,i)=>{if(ids.has(t.id))items.push([i,t])});
  if(!items.length)return;
  state.tasks=state.tasks.filter(t=>!ids.has(t.id));save();
  toast(items.length===1?'Tarefa excluída':items.length+' tarefas excluídas',()=>{
    items.forEach(([i,t])=>state.tasks.splice(Math.min(i,state.tasks.length),0,t));save();render()});
}
$('selCancel').onclick=()=>{resetSel();render()};
$('selAll').onclick=()=>{selIds=new Set([...document.querySelectorAll('#content li.task')].map(l=>l.dataset.id));render()};
$('selDel').onclick=()=>{const ids=new Set(selIds);resetSel();removeMany(ids);render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selMode){resetSel();render()}});
const C=$('content');
C.addEventListener('contextmenu',e=>{if(e.target.closest('li.task'))e.preventDefault()});
C.addEventListener('touchstart',e=>{
  lpPending=false;
  const li=e.target.closest('li.task');
  if(!li||e.touches.length!==1){gest=null;return}
  if(openLi&&openLi!==li)closeSwipe();
  const p=e.touches[0];
  gest={li,x:p.clientX,y:p.clientY,dx:0,mode:'',base:li===openLi?-96:0,timer:null};
  if(!selMode)gest.timer=setTimeout(()=>{if(gest&&!gest.mode){gest.mode='lp';lpPending=true;enterSel(li.dataset.id)}},450);
},{passive:true});
C.addEventListener('touchmove',e=>{
  if(!gest||gest.mode==='lp')return;
  const p=e.touches[0],dx=p.clientX-gest.x,dy=p.clientY-gest.y;
  if(!gest.mode&&(Math.abs(dx)>8||Math.abs(dy)>8)){
    clearTimeout(gest.timer);
    gest.mode=(!selMode&&Math.abs(dx)>Math.abs(dy)*1.5&&(dx<0||gest.base<0))?'swipe':'scroll';
    if(gest.mode==='swipe')gest.li.classList.add('drag');
  }
  if(gest.mode==='swipe'){gest.dx=dx;rowIn(gest.li).style.transform='translateX('+Math.max(-96,Math.min(0,gest.base+dx))+'px)'}
},{passive:true});
function endGesture(){
  if(!gest)return;clearTimeout(gest.timer);
  if(gest.mode==='swipe'){
    const li=gest.li,x=gest.base+gest.dx;li.classList.remove('drag');suppress=Date.now()+250;
    if(x<-48){li.classList.add('sw');rowIn(li).style.transform='translateX(-96px)';openLi=li}
    else{li.classList.remove('sw');rowIn(li).style.transform='';if(openLi===li)openLi=null}
  }
  gest=null;
}
C.addEventListener('touchend',endGesture);C.addEventListener('touchcancel',endGesture);
$('tabs').onclick=e=>{
  const b=e.target.closest('.tab');if(!b)return;
  if(b.dataset.add){nameMode='new';$('nameTitle').textContent='Nova lista';$('nName').value='';$('nameDlg').showModal();setTimeout(()=>$('nName').focus(),50);return}
  resetSel();view=b.dataset.v;showDone=false;render();

};

    if(p.list)chips.push('# '+p.list);

  $('prev').innerHTML=chips.map(c=>`<span>${esc(c)}</span>`).join('');

$('form').onsubmit=e=>{
  e.preventDefault();
  const raw=$('newTask').value.trim();if(!raw)return;

  $('newTask').value='';$('newTask').oninput();save();render();buzz();
};

$('newSub').onkeydown=e=>{
  if(e.key!=='Enter')return;e.preventDefault();
  const v=$('newSub').value.trim();if(!v)return;
  draft.subs.push({t:v,done:false});$('newSub').value='';drawSubs();
};
$('eform').addEventListener('submit',()=>{
  const t=get(editId);if(!t)return;
  const v=$('newSub').value.trim();if(v)draft.subs.push({t:v,done:false});
  t.title=$('eTitle').value.trim()||t.title;t.notes=$('eNotes').value.trim();
  const oldKey=t.date+'|'+t.time+'|'+t.remind,oldDate=t.date,oldRepeat=t.repeat;
  t.date=$('eDate').value;t.prio=draft.prio;t.repeat=$('eRepeat').value;t.list=$('eList').value;
  t.time=$('eTime').value;t.remind=t.time?$('eRemind').value:'';
  if((t.repeat||t.time)&&!t.date)t.date=today();
  if(t.date+'|'+t.time+'|'+t.remind!==oldKey)t.notified='';
  if(t.date!==oldDate||t.repeat!==oldRepeat)t.anchor=0;
  t.subs=draft.subs.filter(s=>s.t.trim());
  save();render();
});
$('eCancel').onclick=()=>$('sheet').close();
$('eDel').onclick=()=>{$('sheet').close();removeTask(editId)};
for(const id of ['sheet','nameDlg','menuDlg','alexaDlg'])$(id).addEventListener('click',e=>{if(e.target===$(id))$(id).close()});

/* ---------- listas ---------- */
$('nCancel').onclick=()=>$('nameDlg').close();
$('nameForm').addEventListener('submit',()=>{
  const n=$('nName').value.trim();
  if(!n||['todas','hoje','em breve','calendário','calendario','sem lista'].includes(n.toLowerCase()))return;
  if(nameMode==='new'){
    if(state.lists.includes(n)){view='l:'+n}else{state.lists.push(n);view='l:'+n}
  }else{
    const old=view.slice(2);
    if(n!==old&&!state.lists.includes(n)){
      state.lists=state.lists.map(l=>l===old?n:l);state.tasks.forEach(t=>{if(t.list===old)t.list=n});view='l:'+n;
    }
  }
  save();render();
});

/* ---------- menu, backup ---------- */
$('btnMenu').onclick=()=>{
  const isList=view.startsWith('l:');
  $('mRename').hidden=!isList;$('mDelList').hidden=!isList;
  $('mNotify').textContent=state.settings.notify?'Desativar notificações':'Ativar notificações';
  $('mAlexa').textContent=alexa?'Alexa conectada ✓ (desconectar)':'Conectar Alexa';
  $('menuDlg').showModal();
};
$('mRename').onclick=()=>{$('menuDlg').close();nameMode='rename';$('nameTitle').textContent='Renomear lista';$('nName').value=view.slice(2);$('nameDlg').showModal()};
$('mDelList').onclick=()=>{
  const l=view.slice(2);
  if(!confirm(`Excluir a lista "${l}"? As tarefas dela não serão apagadas: ficam sem lista.`))return;
  state.tasks.forEach(t=>{if(t.list===l)t.list=''});
  state.lists=state.lists.filter(x=>x!==l);view='hoje';save();render();$('menuDlg').close();
};
$('mClear').onclick=()=>{
  const n=state.tasks.filter(t=>t.done).length;
  if(!n){toast('Nenhuma tarefa concluída');$('menuDlg').close();return}
  if(!confirm(`Apagar ${n} tarefa(s) concluída(s)? Isso não pode ser desfeito.`))return;
  state.tasks=state.tasks.filter(t=>!t.done);save();render();$('menuDlg').close();
};
/* ---------- Alexa: caixa de entrada na nuvem ---------- */
const AKEY='tarefas.alexa'; // fica fora do backup de propósito (contém a chave)
let alexa=null;
try{alexa=JSON.parse(localStorage.getItem(AKEY))}catch(e){}
if(!alexa||typeof alexa.u!=='string'||typeof alexa.k!=='string')alexa=null;

function taskFromText(text,src){
  const p=parseQuick(text);let date=p.date||'';
  if((p.repeat||p.time)&&!date)date=today();
  const title=p.title.charAt(0).toUpperCase()+p.title.slice(1);
  return {id:uid(),title,done:false,prio:p.prio||'media',date,list:p.list||'',notes:'',subs:[],
    repeat:p.repeat||'',doneAt:'',created:Date.now(),time:p.time||'',remind:p.time?'0':'',notified:'',src:src||''};
}
function decodeCode(c){
  const t=c.trim().replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');
  let o;try{o=JSON.parse(atob(t))}catch(e){return null}
  if(!o||typeof o.u!=='string'||typeof o.k!=='string'||o.k.length<16)return null;
  const u=o.u.replace(/\/+$/,'');
  if(!/^https:\/\/[\w.-]+(:\d+)?(\/[\w./-]*)?$/.test(u)&&!/^http:\/\/localhost(:\d+)?$/.test(u))return null;
  return {u,k:o.k};
}
const aHeaders=extra=>({Authorization:'Bearer '+alexa.k,...(extra||{})});
let polling=false;
async function pollAlexa(){
  if(!alexa||polling||document.hidden)return;
  polling=true;
  try{
    const r=await fetch(alexa.u+'/inbox',{headers:aHeaders(),cache:'no-store'});
    if(!r.ok)return;
    const items=(await r.json()).items||[];if(!items.length)return;
    const novas=[];
    for(const it of items){
      if(state.tasks.some(t=>t.src==='alexa:'+it.id))continue;
      if(!String(it.text||'').trim())continue;
      const t=taskFromText(String(it.text||''),'alexa:'+it.id);state.tasks.push(t);novas.push(t);
    }
    save();render(); // grava antes de confirmar: se o ack falhar, nada se perde nem duplica
    await fetch(alexa.u+'/ack',{method:'POST',headers:aHeaders({'Content-Type':'application/json'}),body:JSON.stringify({ids:items.map(i=>i.id)})});
    if(novas.length){buzz();toast(novas.length===1?'Alexa adicionou: '+novas[0].title:novas.length+' tarefas adicionadas pela Alexa')}
  }catch(e){}finally{polling=false}
}
$('mAlexa').onclick=()=>{
  if(alexa){
    if(!confirm('Desconectar a Alexa deste aparelho? As tarefas já importadas continuam aqui.'))return;
    alexa=null;try{localStorage.removeItem(AKEY)}catch(e){}
    $('menuDlg').close();toast('Alexa desconectada');return;
  }
  $('aCode').value='';$('aMsg').textContent='';$('menuDlg').close();$('alexaDlg').showModal();
};
$('aCancel').onclick=()=>$('alexaDlg').close();
$('aGo').onclick=async()=>{
  const cfg=decodeCode($('aCode').value);
  if(!cfg){$('aMsg').textContent='Código inválido. Copie o código inteiro e cole de novo.';return}
  $('aMsg').textContent='Testando conexão…';
  try{
    const r=await fetch(cfg.u+'/inbox',{headers:{Authorization:'Bearer '+cfg.k},cache:'no-store'});
    if(r.status===401){$('aMsg').textContent='A chave foi recusada pelo servidor.';return}
    if(!r.ok){$('aMsg').textContent='O servidor respondeu com erro ('+r.status+').';return}
  }catch(e){$('aMsg').textContent='Não consegui falar com o servidor. Confira a internet.';return}
  alexa=cfg;try{localStorage.setItem(AKEY,JSON.stringify(cfg))}catch(e){}
  $('alexaDlg').close();toast('Alexa conectada');pollAlexa();
};

async function notify(title,body,tag){
  try{const reg=await navigator.serviceWorker.getRegistration();
    if(reg){await reg.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png'});return}}catch(e){}
  try{new Notification(title,{body,tag,icon:'icon-192.png'})}catch(e){}
}
function checkReminders(){
  if(!state.settings.notify||!('Notification' in window)||Notification.permission!=='granted')return;
  const now=Date.now();let changed=false;
  for(const t of state.tasks){
    if(t.done||!t.date||!t.time||t.remind==='')continue;
    const at=new Date(t.date+'T'+t.time+':00').getTime()-Number(t.remind)*60000,key=String(at);
    if(at<=now&&now-at<12*3600e3&&t.notified!==key){
      t.notified=key;changed=true;
      const when={'0':'Agora','10':'Em 10 min','60':'Em 1 hora','1440':'Amanhã'}[t.remind]||'';
      notify(t.title,(now-at>5*60000?'Lembrete perdido · ':when+' · ')+t.time,t.id);
    }
  }
  if(changed)save();
}
$('mNotify').onclick=async()=>{
  if(state.settings.notify){state.settings.notify=false;save();$('menuDlg').close();toast('Notificações desativadas');return}
  if(!('Notification' in window)){toast('Notificações indisponíveis aqui. No iPhone, adicione o app à Tela de Início.');return}
  const perm=Notification.permission==='granted'?'granted':await Notification.requestPermission();
  if(perm==='granted'){
    state.settings.notify=true;save();$('menuDlg').close();
    notify('Notificações ativadas','Você será avisado dos lembretes com o app aberto.','teste');checkReminders();
  }else toast('Permissão negada. Libere nas configurações do navegador.');
};
$('mExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tarefas-backup-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  $('menuDlg').close();toast('Backup exportado');
};
$('mImport').onclick=()=>$('file').click();
$('file').onchange=async()=>{
  const f=$('file').files[0];$('file').value='';if(!f)return;
  try{
    const s=JSON.parse(await f.text());
    if(!s||!Array.isArray(s.tasks)||!Array.isArray(s.lists))throw 0;
    if(!confirm(`Importar ${s.tasks.length} tarefa(s)? Isso substitui as tarefas atuais.`))return;
    state=normalize(s);view='hoje';save();render();$('menuDlg').close();toast('Backup importado');
  }catch(e){toast('Arquivo inválido')}
};

/* ---------- início ---------- */
render();
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;
    const go=()=>{if(document.querySelector('dialog[open]')||$('newTask').value)setTimeout(go,5000);else location.reload()}; // não perde o que você está digitando
    go()}});
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();checkReminders();pollAlexa()}});
window.addEventListener('online',pollAlexa);
setInterval(checkReminders,30000);checkReminders();
let lastDay=today(); // app aberto na virada do dia: atualiza "Hoje" e o calendário
setInterval(()=>{const d=today();if(d!==lastDay){if(calSel===lastDay)calSel=d;lastDay=d;calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);render()}},30000);
setInterval(pollAlexa,45000);pollAlexa();
</script>
